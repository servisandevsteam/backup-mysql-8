name: DEPLOYMENT BACKUP MYSQL

on:
  push:
    tags:
      - "v*"

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  js-security:
    uses: ./.github/workflows/js-security.yml

  build:
    needs: [quality, js-security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: docker build
        run: |
          docker build \
            -t "${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE }}:${{ github.ref_name }}" \
            -t "${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE }}:latest" .
      - name: login docker hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_USER_TOKEN }}
      - name: docker push
        run: |
          docker push "${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE }}:${{ github.ref_name }}"
          docker push "${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE }}:latest"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: executing remote ssh commands using password
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVISAN_HOST }}
          username: ${{ secrets.SERVISAN_USERNAME }}
          password: ${{ secrets.SERVISAN_PASSWORD }}
          port: ${{ secrets.SERVISAN_PORT }}
          script: |
            docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_USER_TOKEN }}

            CONTAINER=backup-servisan \
            TAG=${{ github.ref_name }} \
            IMAGE=${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE }} \
            /app/create-containerv2 \
              --restart always \
              --network servisan-network \
              -e DB_NAME="${{ secrets.DB_NAME }}" \
              -e DB_USERNAME="${{ secrets.DB_USERNAME }}" \
              -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              -e DB_HOSTNAME="servisan_db" \
              -e DB_PORT="${{ secrets.DB_PORT }}" \
              -e BACKUP_SCHEDULE="${{ secrets.BACKUP_SCHEDULE }}" \
              -e BACKUP_TIMEZONE="${{ secrets.BACKUP_TIMEZONE }}" \
              -e AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" \
              -e AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
              -e AWS_DEFAULT_REGION="${{ secrets.AWS_DEFAULT_REGION }}" \
              -e AWS_BUCKET="${{ secrets.AWS_BUCKET }}" \
              -e AWS_PREFIX="${{ secrets.AWS_PREFIX }}" \
              -e EXPIRATE_IN_MONTHS="${{ secrets.EXPIRATE_IN_MONTHS }}" \
